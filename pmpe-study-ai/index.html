<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg"></canvas><div class="spot"></div>

<section id="login">
  <div class="login-card">
    <div class="brand"><div class="mark">P</div><div><b>STUDY</b><small>AI · concursos</small></div></div>
    <h1>Seu centro de preparação.</h1>
    <p>Planeje, estude, meça e evolua até a prova.</p>
    <form id="lf">
      <label class="f" for="em">E-mail</label>
      <input id="em" type="email" autocomplete="username">
      <label class="f" for="pw">Senha</label>
      <input id="pw" type="password" autocomplete="current-password">
      <div class="err" id="err" role="alert"></div>
      <button class="btn full" id="lin">Entrar</button>
      <div class="row" style="margin-top:12px;flex-wrap:nowrap"><button type="button" class="btn ghost" id="lup" style="flex:1">Criar conta</button><button type="button" class="btn ghost" id="llc" style="flex:1">Modo local</button></div>
    </form>
    <div class="hint">Com conta, seus dados sincronizam entre aparelhos. No modo local, ficam só neste navegador.</div>
  </div>
</section>

<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><div class="mark">P</div><div><b>STUDY</b><small>AI · concursos</small></div></div>
    <select id="edsel" aria-label="Edital"></select>
    <nav id="nav"></nav>
    <div class="foot">
      <div id="sync" class="pill"></div>
      <a href="#/dados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>Meus dados</span></a>
      <a href="#" id="out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4M16 8l4 4-4 4M20 12H9"/></svg><span>Sair</span></a>
    </div>
  </aside>
  <main id="view" class="view"></main>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
